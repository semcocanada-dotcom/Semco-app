name: EAS — OTA Update

on:
  push:
    branches:
      - claude/autism-grant-app-eUE6R
      - claude/autism-grant-app-eUE6R-kqhpH
    paths-ignore:
      - 'BUILD_TRIGGER'

jobs:
  update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Push OTA update
        env:
          EXPO_TOKEN: ${{ secrets.AUTISM_APP }}
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
