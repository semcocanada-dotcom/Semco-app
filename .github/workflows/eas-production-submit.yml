name: EAS — Production Build & App Store Submit

# Manual-only: this builds with the production profile (uses a build credit)
# and uploads the result to App Store Connect for TestFlight/App Review.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-submit:
    name: Build iOS production + submit to App Store Connect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.13.0

      - name: Preflight Expo auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing or empty."
            exit 1
          fi
          echo "EXPO_TOKEN is set; continuing."

      - name: Build iOS production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit latest build to App Store Connect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform ios --latest --non-interactive
